name: CI - Debug Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - "README*.md"
      - "*.md"

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Prepare Executable Environment
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Sign APK
        id: sign_apk
        uses: ilharp/sign-android-release@v2
        continue-on-error: true
        with:
          releaseDir: app/build/outputs/apk/debug
          signingKey: ${{ secrets.ANDROID_RELEASE_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

      - name: Extract Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegionTube-Debug-Artifact
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn