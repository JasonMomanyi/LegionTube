android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# 16 GB machine — give Gradle 6 GB heap + generous metaspace
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC
kotlin.compiler.execution.strategy=in-process

# Parallel execution and caching for faster builds
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4
org.gradle.daemon.idleTimeout=60000
android.enableR8.fullMode=true
