name: Build and Release LegionTube

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g., v2.2.0)'
        required: true
        default: 'v2.2.0'
  release:
    types: [published]
  push:
    tags:
      - 'v*.*'

jobs:
  build:
    name: Compile and Sign Android APK
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Prepare Executable Environment
        run: chmod +x ./gradlew

      - name: Build Official Release APK
        run: ./gradlew assembleGithubRelease --no-daemon

      - name: Sign Android APK
        uses: ilharp/sign-android-release@v2
        id: sign
        with:
          releaseDir: app/build/outputs/apk/github/release
          signingKey: ${{ secrets.ANDROID_RELEASE_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

      - name: Rename APK Output
        run: mv "${{ steps.sign.outputs.signedFile }}" "LegionTube-Official.apk"

      - name: Generate Changelog
        id: changelog
        uses: requarks/changelog-action@v1
        continue-on-error: true
        with:
          token: ${{ github.token }}
          tag: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changes }}
          files: "LegionTube-Official.apk"
          fail_on_unmatched_files: true
          make_latest: true
          tag_name: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}
